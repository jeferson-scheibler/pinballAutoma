# Trecho do nginx que publica a pagina das mesas em https://dati.dev.br/mesa-pinball/
#
# NAO e um arquivo completo: cole estes dois blocos DENTRO do "server { ... }" HTTPS que ja
# atende dati.dev.br (o que tem "listen 443 ssl" e o certificado do dominio). Nao altere os
# outros blocos. Depois valide e recarregue (sem restart):
#   sudo nginx -t && sudo systemctl reload nginx

    # Sem a barra final, redireciona para ela (a pagina usa enderecos relativos)
    location = /mesa-pinball {
        return 301 /mesa-pinball/;
    }

    location /mesa-pinball/ {
        # A barra final em proxy_pass remove o prefixo /mesa-pinball/ antes de repassar
        proxy_pass http://127.0.0.1:8444/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # O servidor usa este cabecalho para bloquear IPs que erram a senha
        proxy_set_header X-Real-IP $remote_addr;

        # O video e um fluxo continuo (multipart/x-mixed-replace): nao pode ser bufferizado
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
